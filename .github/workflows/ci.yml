name: CI
# Fetch configured Git sources without SSH credentials on hosted runners.
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
  GIT_CONFIG_VALUE_0: 'git@github.com:'
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Install native build tools
        run: |
          apt-get update
          apt-get install -y git curl ca-certificates build-essential cmake ninja-build python3 pkg-config libgirepository1.0-dev gobject-introspection libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libx11-dev libxext-dev libgtk-4-dev librsvg2-dev xvfb xauth dbus-x11 dpkg-dev libfile-fcntllock-perl libfontconfig1 fonts-dejavu-core perl
      - uses: actions/checkout@v4
      - name: Install compiler and build Git dependencies
        run: |
          mkdir -p tmp
          curl -fL --retry 3 https://github.com/namo-robotics/sun/releases/download/dev/sun_0.dev_amd64.deb -o tmp/sun.deb
          apt-get install -y ./tmp/sun.deb
          sun dep install --config sun-config.json --yes
          ./scripts/install-dependencies.sh
      - name: Format and headless tests
        run: |
          sun fmt --check src tests
          ./build.sh --test
      - name: Plot accuracy tests
        run: ./build.sh --plot-test
      - name: Build and GTK acceptance
        run: xvfb-run -a dbus-run-session -- ./build.sh --self-test
      - name: Package and smoke-test
        run: ./scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          if-no-files-found: error
          path: |
            build/*.deb
            build/*.sha256
            build/sun-version.txt
            build/dependencies/*/resolution.json
            build/dependencies/*/LICENSE
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install published compiler and dependencies
        run: |
          test "$(uname -m)" = arm64
          brew install namo-robotics/sun/sun gtk4 librsvg pkgconf coreutils cmake ninja python gobject-introspection gstreamer
          export PKG_CONFIG_PATH="$(brew --prefix libffi)/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          sun dep install --config sun-config.json --yes
          ./scripts/install-dependencies.sh
      - name: Headless tests
        run: ./build.sh --test
      - name: Plot accuracy tests
        run: ./build.sh --plot-test
      - name: Build and GTK acceptance
        run: ./build.sh --self-test
      - name: Package and smoke-test
        run: ./scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          if-no-files-found: error
          path: |
            build/*.dmg
            build/*.sha256
            build/sun-version.txt
            build/macos-native-files.tsv
            build/macos-app-acceptance.log
            build/dependencies/*/resolution.json
            build/dependencies/*/LICENSE
  publish:
    needs: [linux, macos]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
      - name: Publish tested private development release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          tag=dev
          if ! gh release view "$tag" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --draft --repo "$REPOSITORY" --target "$COMMIT" --prerelease --title "Development Build" --notes "Preparing tested packages."
          fi
          find release -type f \( -name '*.deb' -o -name '*.dmg' -o -name '*.sha256' \) -exec gh release upload "$tag" --clobber --repo "$REPOSITORY" {} +
          tar -czf build-provenance.tar.gz release/linux/sun-version.txt release/macos/sun-version.txt release/linux/dependencies release/macos/dependencies release/macos/macos-native-files.tsv
          gh release upload "$tag" --clobber --repo "$REPOSITORY" build-provenance.tar.gz
          # Keep the rolling tag on the commit that produced the uploaded packages.
          if gh api "repos/$REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$REPOSITORY/git/refs/tags/$tag" -f "sha=$COMMIT" -F force=true
          else
            gh api --method POST "repos/$REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$COMMIT"
          fi
          gh release edit "$tag" --repo "$REPOSITORY" --target "$COMMIT" --draft=false --prerelease --title "Development Build" --notes "Build $RUN_NUMBER from $COMMIT. Tested Linux x86-64 and Apple Silicon macOS packages. macOS app is ad-hoc signed."
